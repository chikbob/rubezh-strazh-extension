name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build extension
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Extension tests failed.' }
          & ./tests/bridge-status.tests.ps1
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tests/bridge-status.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw '32-bit Windows PowerShell bridge tests failed.' }
          New-Item -ItemType Directory -Force artifacts/rubezh-strazh-extension-unpacked | Out-Null
          Copy-Item manifest.json artifacts/rubezh-strazh-extension-unpacked/
          Copy-Item src artifacts/rubezh-strazh-extension-unpacked/src -Recurse
          Copy-Item bridge artifacts/rubezh-strazh-extension-unpacked/bridge -Recurse
          Copy-Item INSTALL-RU.txt artifacts/rubezh-strazh-extension-unpacked/
          Copy-Item README.md artifacts/rubezh-strazh-extension-unpacked/
          Compress-Archive artifacts/rubezh-strazh-extension-unpacked artifacts/rubezh-strazh-extension-unpacked-${{ github.ref_name }}.zip

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            artifacts/rubezh-strazh-extension-unpacked-${{ github.ref_name }}.zip
