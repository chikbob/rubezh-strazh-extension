<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Предпросмотр пропуска</title>
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;min-height:100%;background:#dfe4e8;font-family:Arial,sans-serif;color:#26313a}
    main{display:grid;min-height:100vh;place-items:center;padding:28px}
    .preview{width:min(92vw,760px);padding:24px;background:#fff;border-radius:8px;box-shadow:0 8px 32px #0003}
    h1{margin:0 0 16px;font-size:22px}.sheet{width:100%;aspect-ratio:85.6/54;background:#fff;box-shadow:0 3px 16px #0004}
    .sheet img{display:block;width:100%;height:100%}.photo-step,.identifier-step{display:flex;align-items:center;gap:12px;margin-top:16px}.photo-step button{min-width:150px}.photo-name{min-width:0;overflow:hidden;color:#4d5963;text-overflow:ellipsis;white-space:nowrap}.identifier-step select{flex:1;min-height:42px;padding:0 10px;font:15px Arial;border:1px solid #aeb7bf;border-radius:5px}.identifier-step label{font:700 15px Arial;white-space:nowrap}#status{min-height:22px;margin:14px 0 10px;color:#4d5963}
    .actions{display:flex;justify-content:flex-end;gap:10px}
    .position-step{margin-top:16px}.position-step label{display:block;font-weight:700;margin-bottom:8px}.position-row{display:flex;gap:10px}.position-row textarea{flex:1;min-width:0;font:15px Arial;padding:10px;border:1px solid #aeb7bf;border-radius:5px}.position-step small{display:block;margin-top:8px;color:#4d5963}
    button{min-width:120px;min-height:42px;padding:0 18px;border:1px solid #aeb7bf;border-radius:5px;background:#fff;font:700 15px Arial;cursor:pointer}
    button:disabled{cursor:default;opacity:.5}#confirm-print{border-color:#8f172c;background:#a71930;color:#fff}
    @media(max-width:600px){main{padding:10px}.preview{padding:14px}.photo-step{align-items:stretch;flex-direction:column}.photo-step button{min-width:0}.actions{display:grid;grid-template-columns:1fr 1fr}button{min-width:0}}
  </style>
</head>
<body><main><section class="preview"><h1>Предпросмотр пропуска</h1><div class="sheet"><img id="card" alt="Пропуск"></div><div id="identifier-step" class="identifier-step" hidden><label for="identifier-select">Идентификатор</label><select id="identifier-select"></select></div><div class="photo-step"><input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp,.bmp" hidden><button id="select-photo" type="button" hidden>Выбрать фото</button><span id="photo-name" class="photo-name" hidden>Фото не выбрано</span></div>
<div id="position-step" class="position-step" hidden><label for="position-text">Должность на пропуске</label><div class="position-row"><textarea id="position-text" rows="2" maxlength="200"></textarea><button id="apply-position" type="button">Применить</button></div><small>Автосокращения и перенос до двух строк без уменьшения шрифта. Enter задаёт перенос вручную. Можно поправить текст вручную; карточка RUBEZH не изменяется.</small></div>
<p id="status">Формирование пропуска…</p><div class="actions"><button id="cancel-print" type="button">Отмена</button><button id="confirm-print" type="button" disabled>Печать</button></div></section></main><script type="module" src="print.js"></script></body>
</html>
