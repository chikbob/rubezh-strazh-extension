<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">Установка: Print Bridge и настройки</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a71930"/></marker><style>text{font:18px Arial,sans-serif;fill:#26313a}.callout{font:bold 18px Arial,sans-serif;fill:#a71930}.arrow{fill:none;stroke:#a71930;stroke-width:3;marker-end:url(#head)}</style></defs><rect width="900" height="540" rx="14" fill="#f0f4f7"/><text x="28" y="35" style="font:bold 22px Arial">Установка: Print Bridge и настройки</text><rect x="45" y="105" width="370" height="330" rx="8" fill="white" stroke="#bdc8d0"/><text x="64" y="144">Распакованный релиз → bridge</text><text x="74" y="198">📄 RubezhPrintBridge.ps1</text><rect x="64" y="220" width="315" height="46" rx="5" fill="#ffe8ed"/><text x="79" y="250">▶ install.cmd</text><text x="74" y="300">После установки:</text><text x="74" y="332">installed and started successfully</text><text x="74" y="390">Не запускать во время печати!</text><rect x="478" y="105" width="377" height="330" rx="8" fill="white" stroke="#bdc8d0"/><text x="500" y="145">Расширение → Настройки</text><text x="500" y="193">Адрес RUBEZH</text><rect x="499" y="212" width="330" height="44" fill="#f5f7fa" stroke="#bdc8d0"/><text x="510" y="242">http://адрес-вашего-сервера</text><rect x="499" y="283" width="180" height="43" rx="5" fill="#a71930"/><text x="530" y="312" style="fill:white">Сохранить</text><text x="500" y="374">Затем Ctrl+R в карточке RUBEZH</text><path d="M204 65 L208 211" class="arrow"/><text x="46" y="63" class="callout">① Запустите install.cmd</text><path d="M719 68 L683 202" class="arrow"/><text x="480" y="64" class="callout">② Укажите адрес из браузера</text><path d="M427 463 L610 338" class="arrow"/><text x="470" y="481" class="callout">③ Сохраните и обновите страницу</text><text x="28" y="528" style="font:13px Arial;fill:#65727d">Схема интерфейса. Данные вымышлены; вид и названия элементов могут немного отличаться.</text></svg>
