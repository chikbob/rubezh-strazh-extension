<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">1. Откройте карточку человека</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a71930"/></marker><style>text{font:18px Arial,sans-serif;fill:#26313a}.callout{font:bold 18px Arial,sans-serif;fill:#a71930}.arrow{fill:none;stroke:#a71930;stroke-width:3;marker-end:url(#head)}</style></defs><rect width="900" height="540" rx="14" fill="#f0f4f7"/><text x="28" y="35" style="font:bold 22px Arial">1. Откройте карточку человека</text><rect x="45" y="115" width="235" height="270" rx="10" fill="#e9eff4"/><text x="66" y="151">Фото в RUBEZH</text><circle cx="163" cy="225" r="42" fill="#b8c8d5"/><path d="M90 338 Q163 250 236 338" fill="#b8c8d5"/><rect x="300" y="115" width="550" height="270" rx="10" fill="#fff" stroke="#bdc8d0"/><text x="323" y="151">Личные данные сотрудника</text><text x="323" y="214">Фамилия · Имя · Отчество</text><text x="323" y="265">Должность / Комментарий</text><text x="323" y="327">Управление картами: 123456789</text><rect x="600" y="163" width="50" height="42" rx="5" fill="#a71930"/><rect x="660" y="163" width="50" height="42" rx="5" fill="#a71930"/><rect x="720" y="163" width="50" height="42" rx="5" fill="#a71930"/><text x="617" y="191" style="fill:white">С</text><text x="677" y="191" style="fill:white">М</text><text x="737" y="191" style="fill:white">В</text><rect x="780" y="163" width="50" height="42" rx="5" fill="#e2e6e9"/><text x="790" y="191">💾</text><path d="M655 76 L678 157" class="arrow"/><text x="370" y="77" class="callout">① Выберите С / М / В рядом с сохранением</text><path d="M345 434 L450 343" class="arrow"/><text x="50" y="461" class="callout">② Проверьте идентификатор именно этого человека</text><text x="28" y="528" style="font:13px Arial;fill:#65727d">Схема интерфейса. Данные вымышлены; вид и названия элементов могут немного отличаться.</text></svg>
