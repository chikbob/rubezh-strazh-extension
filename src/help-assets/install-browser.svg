<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">Установка: загрузка распакованного расширения</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a71930"/></marker><style>text{font:18px Arial,sans-serif;fill:#26313a}.callout{font:bold 18px Arial,sans-serif;fill:#a71930}.arrow{fill:none;stroke:#a71930;stroke-width:3;marker-end:url(#head)}</style></defs><rect width="900" height="540" rx="14" fill="#f0f4f7"/><text x="28" y="35" style="font:bold 22px Arial">Установка: загрузка распакованного расширения</text><rect x="45" y="86" width="810" height="370" rx="10" fill="white" stroke="#bdc8d0"/><rect x="65" y="106" width="770" height="40" rx="7" fill="#eef2f5"/><text x="87" y="134">browser://extensions</text><text x="80" y="193">Расширения</text><text x="540" y="193">Режим разработчика</text><rect x="771" y="170" width="48" height="27" rx="14" fill="#218c61"/><circle cx="805" cy="184" r="10" fill="white"/><rect x="80" y="228" width="320" height="43" rx="5" fill="#e2e6e9"/><text x="94" y="257">Загрузить распакованное расширение</text><rect x="210" y="310" width="460" height="110" rx="8" fill="#f5f7fa" stroke="#bdc8d0"/><text x="231" y="344">Выберите папку:</text><text x="231" y="374">rubezh-strazh-extension-unpacked</text><text x="231" y="403">Внутри неё лежит manifest.json</text><path d="M794 60 L794 160" class="arrow"/><text x="579" y="59" class="callout">① Включите</text><path d="M123 304 L155 282" class="arrow"/><text x="65" y="337" class="callout">② Нажмите</text><path d="M764 367 L680 367" class="arrow"/><text x="694" y="410" class="callout">③ Папка, не ZIP</text><text x="28" y="528" style="font:13px Arial;fill:#65727d">Схема интерфейса. Данные вымышлены; вид и названия элементов могут немного отличаться.</text></svg>
