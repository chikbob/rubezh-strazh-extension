<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Настройки печати пропусков</title><link rel="stylesheet" href="styles.css"></head><body class="options-page"><main class="settings"><h1>Настройки печати пропусков</h1><form id="settings-form"><label>Адрес RUBEZH<input name="allowedOrigin" type="url" required placeholder="http://10.250.225.16"></label><label>Принтер<input name="printer" placeholder="IDP SMART-51 Card Printer"></label><label>Шаблон «Сотрудник»<input value="Встроенный" disabled></label><label>Шаблон «МОСН»<input value="Встроенный" disabled></label><label>Шаблон «Временный»<input value="Встроенный" disabled></label><label class="check"><input name="autoNormalize" type="checkbox"> Автоматически сокращать должность</label><label class="check"><input name="showPreview" type="checkbox"> Показывать предпросмотр</label><label class="check"><input name="debug" type="checkbox"> Диагностический режим</label><button class="primary" type="submit">Сохранить</button><button id="check" class="secondary" type="button">Проверить подключение</button><button id="test-print" class="secondary" type="button">Тестовая печать</button><p id="save-status" class="status" aria-live="polite"></p></form></main><script type="module" src="options.js"></script></body></html>
